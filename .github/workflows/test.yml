name: Test

on:
  workflow_dispatch:
    inputs:
      autofill_presentations:
        description: Run synthetic Android AutoFill runtime and presentation checks
        type: boolean
        default: false
      autofill_transport_probe:
        description: Compare software and swiftshader on fresh AVDs (diagnostic only)
        type: boolean
        default: false
      autofill_save:
        description: Run the isolated synthetic Android password-save handoff
        required: false
        type: boolean
        default: false
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Flutter checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          persist-credentials: false
      - name: Scan current tree for secrets
        id: scan_current_tree_for_secrets
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ARCHIVE_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          binary="$RUNNER_TEMP/gitleaks"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_ARCHIVE_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$binary" dir . --config .gitleaks.toml --redact --no-banner
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        id: setup_flutter
        with:
          flutter-version: 3.41.4
      - name: Install libsodium for native protocol fixtures
        id: install_libsodium_for_native_protocol_fixtures
        run: sudo apt-get update && sudo apt-get install --yes libsodium-dev
      - name: Verify cloud configuration installers
        id: verify_cloud_configuration_installers
        run: python3 -m unittest discover -s tool/tests
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Verify mobile delivery logic
        run: bundle exec ruby fastlane/tests/mobile_delivery_test.rb
      - name: flutter pub get
        id: flutter_pub_get
        run: flutter pub get
      - name: Verify third-party notices
        id: verify_third_party_notices
        run: dart run tool/generate_third_party_notices.dart --check
      - name: flutter analyze
        id: flutter_analyze
        run: flutter analyze
      - name: Enforce Vault v2 structural performance budgets
        id: enforce_vault_v2_structural_performance_budgets
        run: flutter test test/performance/vault_v2_mobile_structural_budget_test.dart
      - name: flutter test
        id: flutter_test
        run: flutter test

      - name: Publish CI check summary
        if: always()
        shell: bash
        env:
          CHECKOUT: ${{ steps.checkout.outcome }}
          SCAN_CURRENT_TREE_FOR_SECRETS: ${{ steps.scan_current_tree_for_secrets.outcome }}
          SETUP_FLUTTER: ${{ steps.setup_flutter.outcome }}
          INSTALL_LIBSODIUM_FOR_NATIVE_PROTOCOL_FIXTURES: ${{ steps.install_libsodium_for_native_protocol_fixtures.outcome }}
          VERIFY_CLOUD_CONFIGURATION_INSTALLERS: ${{ steps.verify_cloud_configuration_installers.outcome }}
          FLUTTER_PUB_GET: ${{ steps.flutter_pub_get.outcome }}
          VERIFY_THIRD_PARTY_NOTICES: ${{ steps.verify_third_party_notices.outcome }}
          FLUTTER_ANALYZE: ${{ steps.flutter_analyze.outcome }}
          ENFORCE_VAULT_V2_STRUCTURAL_PERFORMANCE_BUDGETS: ${{ steps.enforce_vault_v2_structural_performance_budgets.outcome }}
          FLUTTER_TEST: ${{ steps.flutter_test.outcome }}
        run: |
          {
            printf '## CI checks\n\nPlatform: Linux (ubuntu-latest)\n\n'
            printf '| Check | Result |\n| --- | --- |\n'
            printf '| %s | %s |\n' 'Checkout' "${CHECKOUT:-not run}"
            printf '| %s | %s |\n' 'Scan current tree for secrets' "${SCAN_CURRENT_TREE_FOR_SECRETS:-not run}"
            printf '| %s | %s |\n' 'Set up Flutter' "${SETUP_FLUTTER:-not run}"
            printf '| %s | %s |\n' 'Install libsodium for native protocol fixtures' "${INSTALL_LIBSODIUM_FOR_NATIVE_PROTOCOL_FIXTURES:-not run}"
            printf '| %s | %s |\n' 'Verify cloud configuration installers' "${VERIFY_CLOUD_CONFIGURATION_INSTALLERS:-not run}"
            printf '| %s | %s |\n' 'flutter pub get' "${FLUTTER_PUB_GET:-not run}"
            printf '| %s | %s |\n' 'Verify third-party notices' "${VERIFY_THIRD_PARTY_NOTICES:-not run}"
            printf '| %s | %s |\n' 'flutter analyze' "${FLUTTER_ANALYZE:-not run}"
            printf '| %s | %s |\n' 'Enforce Vault v2 structural performance budgets' "${ENFORCE_VAULT_V2_STRUCTURAL_PERFORMANCE_BUDGETS:-not run}"
            printf '| %s | %s |\n' 'flutter test' "${FLUTTER_TEST:-not run}"
            printf '\n[Open workflow logs](%s/%s/actions/runs/%s/attempts/%s)\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf '\nFailure details stay in the failing check log; this report contains only check outcomes.\n'
          } >> "$GITHUB_STEP_SUMMARY"

  autofill-save:
    name: Synthetic Android password-save handoff
    if: github.event_name == 'workflow_dispatch' && inputs.autofill_save
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.41.4
      - name: Prepare isolated Android tooling
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libpulse0
          test -e /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;36.0.0' 'emulator' 'system-images;android-35;google_apis;x86_64'
          "$ANDROID_HOME/emulator/emulator" -accel-check
          curl --fail --location --silent --show-error --max-time 180 \
            https://services.gradle.org/distributions/gradle-8.14-bin.zip \
            --output "$RUNNER_TEMP/gradle.zip"
          printf '%s  %s\n' '61ad310d3c7d3e5da131b76bbf22b5a4c0786e9d892dae8c1658d4b484de3caa' "$RUNNER_TEMP/gradle.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
      - name: Verify production native AutoFill logic
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gradle-8.14/bin/gradle" --no-daemon \
            -p tool/android-autofill-harness :provider:testDebugUnitTest
      - name: Build and verify isolated debug APKs
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/android-autofill-save-harness/build.py \
            --gradle "$RUNNER_TEMP/gradle-8.14/bin/gradle" \
            --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt"
          flutter test --no-pub tool/android-autofill-save-harness/test/synthetic_draft_test.dart
          python3 -m unittest discover -s tool/android-autofill-save-harness/test -p 'test_*.py'
      - name: Validate actual OS save and Flutter handoff
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="$RUNNER_TEMP/palladin-save-avd"
          evidence=tool/android-autofill-save-harness/build
          mkdir -p "$ANDROID_AVD_HOME" "$evidence"
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          export ADB="$ANDROID_HOME/platform-tools/adb"
          timeout 10 "$ADB" version > "$evidence/adb-version.txt"
          timeout 15 "$ADB" start-server
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --name palladin-save \
            --package 'system-images;android-35;google_apis;x86_64' --device pixel_2
          "$ANDROID_HOME/emulator/emulator" -avd palladin-save \
            -port 5554 -no-window -no-audio -no-snapshot -no-boot-anim \
            -gpu swiftshader_indirect -memory 2048 > "$evidence/emulator.log" 2>&1 &
          export emulator_pid=$!
          phase=emulator-started
          mark_phase() {
            phase=$1
            printf '%s\n' "$phase" | tee "$evidence/phase.txt"
          }
          cleanup() {
            result=$?
            set +e
            {
              printf 'phase=%s\nstep_exit=%s\n' "$phase" "$result"
              date -u
              free -m
              ps -p "$emulator_pid" -o pid,stat,rss,vsz,etime,comm
              if [ -r /sys/fs/cgroup/memory.events ]; then cat /sys/fs/cgroup/memory.events; fi
              timeout 10 adb -s emulator-5554 get-state
              printf 'adb_state_exit=%s\n' "$?"
              if kill -0 "$emulator_pid" 2>/dev/null; then
                echo emulator_process=running
              else
                emulator_exit=0
                wait "$emulator_pid" || emulator_exit=$?
                printf 'emulator_exit=%s\n' "$emulator_exit"
              fi
            } > "$evidence/runtime-state.txt" 2>&1
            timeout 10 adb -s emulator-5554 emu kill >/dev/null 2>&1
            kill "$emulator_pid" 2>/dev/null
            exit "$result"
          }
          trap cleanup EXIT
          mark_phase wait-for-boot
          # Expand device state inside the bounded subprocess, checking emulator liveness.
          # shellcheck disable=SC2016
          timeout 180 bash -c 'until [ "$(timeout 5 adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = 1 ]; do kill -0 "$emulator_pid" 2>/dev/null || exit 1; sleep 2; done'
          mark_phase unlock-screen
          timeout 10 adb -s emulator-5554 shell input keyevent 82
          # Fresh disposable AVD only: server flag refreshes destroy active AutoFill sessions.
          timeout 10 adb -s emulator-5554 shell cmd device_config set_sync_disabled_for_tests until_reboot
          test "$(timeout 10 adb -s emulator-5554 shell cmd device_config get_sync_disabled_for_tests | tr -d '\r')" = until_reboot
          for animation in window_animation_scale transition_animation_scale animator_duration_scale; do
            mark_phase "disable-$animation"
            timeout 10 adb -s emulator-5554 shell settings put global "$animation" 0
          done
          mark_phase exercise-save-handoff
          timeout 360 python3 -u tool/android-autofill-save-harness/exercise.py --serial emulator-5554
          mark_phase completed
      - name: Upload synthetic save evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: autofill-save-${{ github.sha }}
          path: |
            tool/android-autofill-save-harness/build/artifacts.json
            tool/android-autofill-save-harness/build/validation.json
            tool/android-autofill-save-harness/build/emulator.log
            tool/android-autofill-save-harness/build/adb-version.txt
            tool/android-autofill-save-harness/build/phase.txt
            tool/android-autofill-save-harness/build/runtime-state.txt
            tool/android-autofill-save-harness/build/failure.json
            tool/android-autofill-save-harness/build/synthetic-failure.png
          if-no-files-found: ignore
          retention-days: 7

  autofill-presentations:
    name: ${{ inputs.autofill_transport_probe && 'Diagnostic renderer comparison (not acceptance)' || 'Synthetic Android AutoFill runtime' }}
    if: github.event_name == 'workflow_dispatch' && (inputs.autofill_presentations || inputs.autofill_transport_probe)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Reject conflicting runtime modes
        if: inputs.autofill_presentations && inputs.autofill_transport_probe
        run: |
          echo 'Choose full AutoFill validation or the diagnostic probe, never both.' >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare isolated Android tooling
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libpulse0
          test -e /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;36.0.0' 'emulator' 'system-images;android-35;google_apis;x86_64'
          "$ANDROID_HOME/emulator/emulator" -accel-check
          curl --fail --location --silent --show-error --max-time 180 \
            https://services.gradle.org/distributions/gradle-8.14-bin.zip \
            --output "$RUNNER_TEMP/gradle.zip"
          printf '%s  %s\n' '61ad310d3c7d3e5da131b76bbf22b5a4c0786e9d892dae8c1658d4b484de3caa' "$RUNNER_TEMP/gradle.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
      - name: Verify synthetic UI driver regressions
        run: python3 -m unittest discover -s tool/android-autofill-harness/tests
      - name: Compare renderer transport on identical synthetic APKs
        if: inputs.autofill_transport_probe
        timeout-minutes: 28
        run: timeout 1500 python3 -u tool/android-autofill-harness/transport_probe.py --gradle "$RUNNER_TEMP/gradle-8.14/bin/gradle"
      - name: Validate committed synthetic AutoFill runtime
        if: ${{ !inputs.autofill_transport_probe }}
        timeout-minutes: 28
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="$RUNNER_TEMP/palladin-presentation-avd"
          evidence=tool/android-autofill-harness/build/presentation
          mkdir -p "$ANDROID_AVD_HOME" "$evidence"
          git rev-parse HEAD > "$evidence/commit.txt"
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          export ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" version > "$evidence/adb-version.txt"
          timeout 15 "$ADB" start-server
          "$ANDROID_HOME/emulator/emulator" -version > "$evidence/emulator-version.txt" 2>&1
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --name palladin-presentation \
            --package 'system-images;android-35;google_apis;x86_64' --device pixel_2
          "$ANDROID_HOME/emulator/emulator" -avd palladin-presentation \
            -port 5554 -no-window -no-audio -no-snapshot -no-boot-anim \
            -gpu software -memory 2048 > "$evidence/emulator.log" 2>&1 &
          export emulator_pid=$!
          cleanup() {
            result=$?
            {
              date -u
              free -m
              ps -p "$emulator_pid" -o pid,stat,rss,vsz,etime,comm || true
              if [ -r /sys/fs/cgroup/memory.events ]; then cat /sys/fs/cgroup/memory.events; fi
              timeout 10 adb -s emulator-5554 get-state || true
              if kill -0 "$emulator_pid" 2>/dev/null; then
                echo emulator_process=running
              else
                emulator_exit=0
                wait "$emulator_pid" || emulator_exit=$?
                echo "emulator_exit=$emulator_exit"
              fi
            } > "$evidence/runtime-state.txt" 2>&1
            timeout 10 adb -s emulator-5554 emu kill >/dev/null 2>&1 || true
            kill "$emulator_pid" 2>/dev/null || true
            exit "$result"
          }
          trap cleanup EXIT
          # Expansion must happen inside the bounded boot-wait subprocess.
          # shellcheck disable=SC2016
          timeout 180 bash -c 'until [ "$(timeout 5 adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = 1 ]; do kill -0 "$emulator_pid" 2>/dev/null || exit 1; sleep 2; done'
          for property in ro.build.version.sdk ro.product.cpu.abilist ro.dalvik.vm.native.bridge; do
            printf '%s=' "$property" >> "$evidence/platform.txt"
            timeout 10 adb -s emulator-5554 shell getprop "$property" >> "$evidence/platform.txt"
          done
          timeout 10 adb -s emulator-5554 shell input keyevent 82
          # Fresh disposable AVD only: server flag refreshes destroy active AutoFill sessions.
          timeout 10 adb -s emulator-5554 shell cmd device_config set_sync_disabled_for_tests until_reboot
          test "$(timeout 10 adb -s emulator-5554 shell cmd device_config get_sync_disabled_for_tests | tr -d '\r')" = until_reboot
          for animation in window_animation_scale transition_animation_scale animator_duration_scale; do
            timeout 10 adb -s emulator-5554 shell settings put global "$animation" 0
          done
          timeout 1500 python3 -u tool/android-autofill-harness/validate.py \
            --serial emulator-5554 --prepare-ci --gradle "$RUNNER_TEMP/gradle-8.14/bin/gradle"
      - name: Upload synthetic runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.autofill_transport_probe && format('autofill-transport-probe-{0}', github.sha) || format('autofill-runtime-{0}', github.sha) }}
          path: |
            tool/android-autofill-harness/build/presentation/
            tool/android-autofill-harness/build/enrollment/
            tool/android-autofill-harness/build/exercise/
            tool/android-autofill-harness/build/validation.json
            tool/android-autofill-harness/build/transport-probe/
          if-no-files-found: ignore
          retention-days: 7
