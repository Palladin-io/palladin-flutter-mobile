name: Test

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install libsodium for native protocol fixtures
        run: sudo apt-get update && sudo apt-get install --yes libsodium-dev
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
