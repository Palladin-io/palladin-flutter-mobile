---
name: Mobile Release
'on':
  workflow_dispatch:
    inputs:
      environment:
        description: Separate app and backend environment
        type: choice
        options:
        - prod
        - stg
        default: prod
        required: true
      platform:
        description: Platforms to release or resume
        type: choice
        options:
        - both
        - android
        - ios
        default: both
        required: true
      operation:
        description: New release or upload existing artifacts
        type: choice
        options:
        - release
        - resume-upload
        default: release
        required: true
      version_mode:
        description: Marketing version selection
        type: choice
        options:
        - keep
        - patch
        - minor
        - major
        - manual
        default: keep
        required: true
      version:
        description: X.Y.Z; manual mode only
        type: string
        required: false
      source_run_id:
        description: Original Mobile Release run ID; resume only
        type: string
        required: false
      create_github_draft:
        description: Create an optional GitHub draft release
        type: boolean
        default: false
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: mobile-release
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
    - name: Validate release request
      env:
        GH_TOKEN: "${{ github.token }}"
        RELEASE_ENVIRONMENT: "${{ inputs.environment }}"
        RELEASE_PLATFORM: "${{ inputs.platform }}"
        VERSION_MODE: "${{ inputs.version_mode }}"
        MANUAL_VERSION: "${{ inputs.version }}"
        SOURCE_RUN_ID: "${{ inputs.source_run_id }}"
        STAGING_ENABLED: "${{ vars.MOBILE_STAGING_ENABLED }}"
        BUILD_SEQUENCE_FLOOR: "${{ vars.MOBILE_BUILD_SEQUENCE_FLOOR }}"
      run: |
        test "$GITHUB_REF" = refs/heads/main
        if [ "$RELEASE_ENVIRONMENT" = stg ]; then test "$STAGING_ENABLED" = true; fi
        if [ -z "$BUILD_SEQUENCE_FLOOR" ]; then echo "Configure MOBILE_BUILD_SEQUENCE_FLOOR after checking existing store builds"; exit 1; fi
  test:
    needs: preflight
    uses: "./.github/workflows/test.yml"
  reserve:
    needs:
    - preflight
    - test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      record: "${{ steps.record.outputs.record }}"
      run_id: "${{ steps.record.outputs.run_id }}"
      source_sha: "${{ steps.record.outputs.source_sha }}"
      flavor: "${{ steps.record.outputs.flavor }}"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Reserve or validate immutable release
      id: record
      env:
        GH_TOKEN: "${{ github.token }}"
        RELEASE_ENVIRONMENT: "${{ inputs.environment }}"
        RELEASE_PLATFORM: "${{ inputs.platform }}"
        VERSION_MODE: "${{ inputs.version_mode }}"
        MANUAL_VERSION: "${{ inputs.version }}"
        SOURCE_RUN_ID: "${{ inputs.source_run_id }}"
        STAGING_ENABLED: "${{ vars.MOBILE_STAGING_ENABLED }}"
        BUILD_SEQUENCE_FLOOR: "${{ vars.MOBILE_BUILD_SEQUENCE_FLOOR }}"
        OPERATION: "${{ inputs.operation }}"
      run: if [ "$OPERATION" = release ]; then python3 tool/mobile_release.py reserve;
        else python3 tool/mobile_release.py resume; fi
  build:
    needs: reserve
    if: "${{ inputs.operation == 'release' }}"
    uses: "./.github/workflows/mobile-store-artifacts.yml"
    with:
      record: "${{ needs.reserve.outputs.record }}"
      platform: "${{ inputs.platform }}"
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      attestations: write
  upload:
    needs:
    - reserve
    - build
    if: "${{ !cancelled() && needs.reserve.result == 'success' && (inputs.operation
      == 'resume-upload' || needs.build.result == 'success' || needs.build.result
      == 'failure') }}"
    uses: "./.github/workflows/mobile-store-upload.yml"
    with:
      record: "${{ needs.reserve.outputs.record }}"
      platform: "${{ inputs.platform }}"
      resume: "${{ inputs.operation == 'resume-upload' }}"
    secrets: inherit
    permissions:
      contents: write
      actions: read
      attestations: read
      id-token: write
  summary:
    needs:
    - preflight
    - test
    - reserve
    - build
    - upload
    - draft
    if: "${{ always() }}"
    runs-on: ubuntu-latest
    steps:
    - name: Release outcome
      env:
        RESULTS: "${{ toJSON(needs) }}"
        ENVIRONMENT: "${{ inputs.environment }}"
      run: |-
        python3 - <<'PYCODE'
        import json,os
        results=json.loads(os.environ['RESULTS'])
        with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
         f.write('## Mobile Release\n\nEnvironment: '+os.environ['ENVIRONMENT']+'\n\n| Stage | Result |\n|---|---|\n')
         record=json.loads(results.get('reserve',{}).get('outputs',{}).get('record') or '{}')
         if record:
          f.write('\nVersion: '+record['marketing_version']+'; Android: '+str(record['android_build'])+'; iOS: '+record['ios_build']+'\n\n')
          f.write('Source: '+record['source_sha'][:8]+'…'+record['source_sha'][-6:]+'; original run: '+str(record['run_id'])+'\n\n')
         for stage,item in results.items(): f.write('| '+stage+' | '+item['result']+' |\n')
         f.write('\nStore processing and tester availability are verified by the upload jobs. No public release is performed.\n')
        PYCODE
  draft:
    needs:
    - reserve
    - upload
    if: "${{ !cancelled() && inputs.create_github_draft && needs.upload.result ==
      'success' }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      attestations: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Create or update draft from verified artifacts
      env:
        GH_TOKEN: "${{ github.token }}"
        RELEASE_RECORD: "${{ needs.reserve.outputs.record }}"
        SOURCE_RUN_ID: "${{ needs.reserve.outputs.run_id }}"
        SOURCE_SHA: "${{ needs.reserve.outputs.source_sha }}"
        PLATFORM: "${{ inputs.platform }}"
      run: |
        set -euo pipefail
        platforms="$PLATFORM"
        if [ "$platforms" = both ]; then platforms="android ios"; fi
        files=()
        for platform in $platforms; do
          folder="release-download/$platform"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "mobile-$SOURCE_RUN_ID-$platform" --dir "$folder"
          gh attestation verify "$folder/release-manifest.json" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/mobile-store-artifacts.yml" --source-digest "$SOURCE_SHA"
          python3 tool/mobile_release.py verify --platform "$platform" --directory "$folder"
          for file in "$folder"/*.aab "$folder"/*.ipa; do
            if [ -f "$file" ]; then
              gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/mobile-store-artifacts.yml" --source-digest "$SOURCE_SHA"
              files+=("$file")
            fi
          done
        done
        tag="mobile-build/$SOURCE_RUN_ID"
        if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft > "$RUNNER_TEMP/draft.json" 2>/dev/null; then
          test "$(jq -r .isDraft "$RUNNER_TEMP/draft.json")" = true
        else
          printf 'Internal mobile release. Source: %s. Original run: %s/%s/actions/runs/%s.
        ' "$SOURCE_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$SOURCE_RUN_ID" > "$RUNNER_TEMP/release-notes.txt"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "Mobile internal build $SOURCE_RUN_ID" --notes-file "$RUNNER_TEMP/release-notes.txt"
        fi
        gh release upload "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
