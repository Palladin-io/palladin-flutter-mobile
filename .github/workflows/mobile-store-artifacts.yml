---
name: Mobile signed artifacts
'on':
  workflow_call:
    inputs:
      record:
        type: string
        required: true
      platform:
        type: string
        required: true
permissions:
  contents: read
jobs:
  android:
    name: Android AAB
    if: "${{ inputs.platform == 'both' || inputs.platform == 'android' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: mobile-store-${{ fromJSON(inputs.record).flavor }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: "${{ github.sha }}"
        persist-credentials: false
    - name: Reject rebuilding a reserved run
      run: test "$GITHUB_RUN_ATTEMPT" = 1 || { echo "Use resume-upload for existing
        artifacts, or dispatch a new release"; exit 1; }
    - name: Use reserved version
      id: app_version
      env:
        BUILD_NAME: "${{ fromJSON(inputs.record).marketing_version }}"
        BUILD_NUMBER: "${{ fromJSON(inputs.record).android_build }}"
      run: printf "build_name=%s\nbuild_number=%s\n" "$BUILD_NAME" "$BUILD_NUMBER"
        >> "$GITHUB_OUTPUT"
    - name: Set up Java
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
      with:
        distribution: temurin
        java-version: '17'
    - name: Set up Flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        flutter-version: 3.41.4
        cache: true
    - name: Prepare Android signing
      env:
        ANDROID_UPLOAD_KEYSTORE_BASE64: "${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64
          }}"
        ANDROID_KEYSTORE_PASSWORD: "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
        ANDROID_KEY_ALIAS: "${{ secrets.ANDROID_KEY_ALIAS }}"
        ANDROID_KEY_PASSWORD: "${{ secrets.ANDROID_KEY_PASSWORD }}"
      run: |
        set -euo pipefail

        for name in ANDROID_UPLOAD_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
          if [ -z "${!name}" ]; then
            echo "::error::Missing GitHub secret: ${name}"
            exit 1
          fi
        done

        printf '%s' "${ANDROID_UPLOAD_KEYSTORE_BASE64}" | base64 --decode > android/upload-keystore.jks
        {
          printf '%s=%s\n' 'storePassword' "${ANDROID_KEYSTORE_PASSWORD}"
          printf '%s=%s\n' 'keyPassword' "${ANDROID_KEY_PASSWORD}"
          printf '%s=%s\n' 'keyAlias' "${ANDROID_KEY_ALIAS}"
          printf '%s=%s\n' 'storeFile' 'upload-keystore.jks'
        } > android/key.properties
    - name: Install dependencies
      run: flutter pub get
    - name: Select runtime configuration
      id: runtime_config
      env:
        FLAVOR: "${{ fromJSON(inputs.record).flavor }}"
        BACKEND_ENVIRONMENT: "${{ fromJSON(inputs.record).flavor }}"
        STAGING_API_BASE_URL: "${{ vars.STAGING_API_BASE_URL }}"
        PRODUCTION_API_BASE_URL: "${{ vars.PRODUCTION_API_BASE_URL }}"
      run: |
        set -euo pipefail

        backend_environment="${BACKEND_ENVIRONMENT}"
        if [ "${backend_environment}" = "matching" ]; then
          backend_environment="${FLAVOR}"
        fi
        if [ "${FLAVOR}" = "staging" ] && [ "${backend_environment}" != "staging" ]; then
          echo "::error::The staging distribution can only target the staging backend"
          exit 1
        fi

        if [ "$backend_environment" = production ]; then
          api_base_url="$PRODUCTION_API_BASE_URL"
        else
          api_base_url="$STAGING_API_BASE_URL"
        fi
        if [ -z "$api_base_url" ]; then
          echo "::error::Missing API base URL for the selected backend environment"
          exit 1
        fi
        {
          echo "api_base_url=$api_base_url"
          echo "backend_environment=${backend_environment}"
          echo "target=lib/main_${FLAVOR}.dart"
        } >> "$GITHUB_OUTPUT"
    - name: Prepare Google OAuth build configuration
      env:
        FLAVOR: "${{ fromJSON(inputs.record).flavor }}"
        BACKEND_ENVIRONMENT: "${{ steps.runtime_config.outputs.backend_environment
          }}"
        STAGING_GOOGLE_SERVER_CLIENT_ID: "${{ vars.STAGING_GOOGLE_SERVER_CLIENT_ID
          }}"
        PRODUCTION_GOOGLE_SERVER_CLIENT_ID: "${{ vars.PRODUCTION_GOOGLE_SERVER_CLIENT_ID
          }}"
      run: |
        set -euo pipefail
        if [ "$BACKEND_ENVIRONMENT" = production ]; then
          export GOOGLE_SERVER_CLIENT_ID="$PRODUCTION_GOOGLE_SERVER_CLIENT_ID"
        else
          export GOOGLE_SERVER_CLIENT_ID="$STAGING_GOOGLE_SERVER_CLIENT_ID"
        fi
        python3 tool/configure_google_oauth.py --flavor "$FLAVOR" --platform android
    - name: Prepare Firebase client configuration
      env:
        FLAVOR: "${{ fromJSON(inputs.record).flavor }}"
        FIREBASE_CLIENT_CONFIG: "${{ vars.FIREBASE_ANDROID_CONFIG }}"
      run: python3 tool/configure_firebase.py --flavor "$FLAVOR" --platform android
    - name: Build Android App Bundle
      env:
        FLAVOR: "${{ fromJSON(inputs.record).flavor }}"
        BACKEND_ENVIRONMENT: "${{ steps.runtime_config.outputs.backend_environment
          }}"
        TARGET: "${{ steps.runtime_config.outputs.target }}"
        API_BASE_URL: "${{ steps.runtime_config.outputs.api_base_url }}"
        BUILD_NAME: "${{ steps.app_version.outputs.build_name }}"
        BUILD_NUMBER: "${{ steps.app_version.outputs.build_number }}"
      run: |
        set -euo pipefail
        flutter build appbundle \
          --release \
          --flavor "${FLAVOR}" \
          -t "${TARGET}" \
          --dart-define="PALLADIN_BACKEND_ENVIRONMENT=${BACKEND_ENVIRONMENT}" \
          --dart-define="PALLADIN_API_BASE_URL=${API_BASE_URL}" \
          --dart-define-from-file="config/google-oauth-${FLAVOR}.local.json" \
          --build-name "${BUILD_NAME}" \
          --build-number "${BUILD_NUMBER}"
    - name: Stage the signed Android artifact
      env:
        FLAVOR: "${{ fromJSON(inputs.record).flavor }}"
      run: |
        set -euo pipefail
        release="$RUNNER_TEMP/android-release"
        sbom_input="$RUNNER_TEMP/android-sbom-input"
        mkdir -p "$release" "$sbom_input"
        mapfile -t artifacts < <(find "build/app/outputs/bundle/${FLAVOR}Release" \
          -maxdepth 1 -type f -name '*.aab' -print)
        test "${#artifacts[@]}" -eq 1
        cp "${artifacts[0]}" "$release/"
        cp pubspec.lock "$sbom_input/"
    - name: Remove Android signing assets
      if: "${{ always() }}"
      run: 'rm -f android/upload-keystore.jks android/key.properties

'
    - name: Generate the Android artifact SBOM
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
      with:
        path: "${{ runner.temp }}/android-sbom-input"
        format: spdx-json
        output-file: "${{ runner.temp }}/android-release/sbom-android.spdx.json"
        upload-artifact: false
        upload-release-assets: false
        dependency-snapshot: false
    - name: Bind artifact to reserved source and tests
      env:
        RELEASE_RECORD: "${{ inputs.record }}"
      run: python3 tool/mobile_release.py manifest --platform android --directory
        "$RUNNER_TEMP/android-release"
    - name: Attest the Android App Bundle
      uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
      with:
        subject-path: "${{ runner.temp }}/android-release/*.aab"
    - name: Attest the Android SBOM
      uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e
      with:
        subject-path: "${{ runner.temp }}/android-release/*.aab"
        sbom-path: "${{ runner.temp }}/android-release/sbom-android.spdx.json"
    - name: Attest release manifest
      uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
      with:
        subject-path: "${{ runner.temp }}/android-release/release-manifest.json"
    - name: Upload Android release set
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: mobile-${{ fromJSON(inputs.record).run_id }}-android
        path: "${{ runner.temp }}/android-release/*"
        if-no-files-found: error
        retention-days: 30
  ios:
    name: iOS IPA
    if: "${{ inputs.platform == 'both' || inputs.platform == 'ios' }}"
    runs-on: macos-15
    timeout-minutes: 45
    environment:
      name: mobile-store-${{ fromJSON(inputs.record).flavor }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: "${{ github.sha }}"
        persist-credentials: false
    - name: Reject rebuilding a reserved run
      run: test "$GITHUB_RUN_ATTEMPT" = 1 || { echo "Use resume-upload for existing
        artifacts, or dispatch a new release"; exit 1; }
    - name: Use reserved version
      id: app_version
      env:
        BUILD_NAME: "${{ fromJSON(inputs.record).marketing_version }}"
        BUILD_NUMBER: "${{ fromJSON(inputs.record).ios_build }}"
      run: printf "build_name=%s\nbuild_number=%s\n" "$BUILD_NAME" "$BUILD_NUMBER"
        >> "$GITHUB_OUTPUT"
    - name: Set up Flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        flutter-version: 3.41.4
        cache: true
    - name: Select iOS signing inputs
      id: ios_signing
      env:
        FLAVOR: "${{ fromJSON(inputs.record).flavor }}"
      run: |
        set -euo pipefail

        case "${FLAVOR}" in
          staging)
            bundle_id="io.palladin.mobile.staging"
            extension_bundle_id="io.palladin.mobile.staging.CredentialProvider"
            ;;
          production)
            bundle_id="io.palladin.mobile"
            extension_bundle_id="io.palladin.mobile.CredentialProvider"
            ;;
          *)
            echo "::error::Unsupported iOS flavor: ${FLAVOR}"
            exit 1
            ;;
        esac

        echo "bundle_id=${bundle_id}" >> "$GITHUB_OUTPUT"
        echo "extension_bundle_id=${extension_bundle_id}" >> "$GITHUB_OUTPUT"
    - name: Install Apple signing assets
      env:
        FLAVOR: "${{ fromJSON(inputs.record).flavor }}"
        IOS_DISTRIBUTION_CERTIFICATE_BASE64: "${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64
          }}"
        IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: "${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD
          }}"
        IOS_PROVISIONING_PROFILE_STAGING_BASE64: "${{ secrets.IOS_PROVISIONING_PROFILE_STAGING_BASE64
          }}"
        IOS_PROVISIONING_PROFILE_PRODUCTION_BASE64: "${{ secrets.IOS_PROVISIONING_PROFILE_PRODUCTION_BASE64
          }}"
        IOS_PROVISIONING_PROFILE_STAGING_CREDENTIAL_PROVIDER_BASE64: "${{ secrets.IOS_PROVISIONING_PROFILE_STAGING_CREDENTIAL_PROVIDER_BASE64
          }}"
        IOS_PROVISIONING_PROFILE_PRODUCTION_CREDENTIAL_PROVIDER_BASE64: "${{ secrets.IOS_PROVISIONING_PROFILE_PRODUCTION_CREDENTIAL_PROVIDER_BASE64
          }}"
      run: |
        set -euo pipefail

        case "${FLAVOR}" in
          staging)
            profile_base64="${IOS_PROVISIONING_PROFILE_STAGING_BASE64}"
            extension_profile_base64="${IOS_PROVISIONING_PROFILE_STAGING_CREDENTIAL_PROVIDER_BASE64}"
            ;;
          production)
            profile_base64="${IOS_PROVISIONING_PROFILE_PRODUCTION_BASE64}"
            extension_profile_base64="${IOS_PROVISIONING_PROFILE_PRODUCTION_CREDENTIAL_PROVIDER_BASE64}"
            ;;
        esac

        for name in IOS_DISTRIBUTION_CERTIFICATE_BASE64 IOS_DISTRIBUTION_CERTIFICATE_PASSWORD; do
          if [ -z "${!name}" ]; then
            echo "::error::Missing GitHub secret: ${name}"
            exit 1
          fi
        done

        if [ -z "${profile_base64}" ]; then
          echo "::error::Missing GitHub secret: IOS_PROVISIONING_PROFILE_${FLAVOR^^}_BASE64"
          exit 1
        fi
        if [ -z "${extension_profile_base64}" ]; then
          echo "::error::Missing GitHub secret: IOS_PROVISIONING_PROFILE_${FLAVOR^^}_CREDENTIAL_PROVIDER_BASE64"
          exit 1
        fi

        cert_path="${RUNNER_TEMP}/ios_distribution.p12"
        profile_path="${RUNNER_TEMP}/profile.mobileprovision"
        extension_profile_path="${RUNNER_TEMP}/credential-provider.mobileprovision"
        keychain_path="${RUNNER_TEMP}/app-signing.keychain-db"
        keychain_password="$(uuidgen)"

        printf '%s' "${IOS_DISTRIBUTION_CERTIFICATE_BASE64}" | base64 -D > "${cert_path}"
        printf '%s' "${profile_base64}" | base64 -D > "${profile_path}"
        printf '%s' "${extension_profile_base64}" | base64 -D > "${extension_profile_path}"

        security create-keychain -p "${keychain_password}" "${keychain_path}"
        security set-keychain-settings -lut 21600 "${keychain_path}"
        security unlock-keychain -p "${keychain_password}" "${keychain_path}"
        security import "${cert_path}" -P "${IOS_DISTRIBUTION_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${keychain_path}"
        original_keychains=()
        while IFS= read -r keychain; do
          keychain="${keychain//\"/}"
          keychain="${keychain#"${keychain%%[![:space:]]*}"}"
          original_keychains+=("${keychain}")
        done < <(security list-keychains -d user)
        security list-keychains -d user -s "${keychain_path}" "${original_keychains[@]}"
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${keychain_password}" "${keychain_path}"

        mkdir -p "${HOME}/Library/MobileDevice/Provisioning Profiles"
        profile_plist="${RUNNER_TEMP}/profile.plist"
        security cms -D -i "${profile_path}" > "${profile_plist}"
        profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "${profile_plist}")
        profile_name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "${profile_plist}")
        cp "${profile_path}" "${HOME}/Library/MobileDevice/Provisioning Profiles/${profile_uuid}.mobileprovision"

        extension_profile_plist="${RUNNER_TEMP}/credential-provider.plist"
        security cms -D -i "${extension_profile_path}" > "${extension_profile_plist}"
        extension_profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "${extension_profile_plist}")
        extension_profile_name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "${extension_profile_plist}")
        cp "${extension_profile_path}" "${HOME}/Library/MobileDevice/Provisioning Profiles/${extension_profile_uuid}.mobileprovision"

        {
          echo "IOS_PROFILE_UUID=${profile_uuid}"
          echo "IOS_PROFILE_NAME=${profile_name}"
          echo "IOS_EXTENSION_PROFILE_UUID=${extension_profile_uuid}"
          echo "IOS_EXTENSION_PROFILE_NAME=${extension_profile_name}"
        } >> "$GITHUB_ENV"

        openssl pkcs12 -in "$cert_path" -clcerts -nokeys -passin env:IOS_DISTRIBUTION_CERTIFICATE_PASSWORD -out "$RUNNER_TEMP/distribution.pem"
        openssl x509 -in "$RUNNER_TEMP/distribution.pem" -checkend 0 -noout
        openssl x509 -in "$RUNNER_TEMP/distribution.pem" -outform DER -out "$RUNNER_TEMP/distribution.der"
    - name: Validate iOS signing profiles
      env:
        IOS_TEAM_ID: "${{ secrets.IOS_TEAM_ID }}"
        BUNDLE_ID: "${{ steps.ios_signing.outputs.bundle_id }}"
        APP_GROUP_IDENTIFIER: "${{ vars.APP_GROUP_IDENTIFIER }}"
      run: python3 tool/verify_ios_profiles.py --app "$RUNNER_TEMP/profile.plist"
        --extension "$RUNNER_TEMP/credential-provider.plist" --certificate "$RUNNER_TEMP/distribution.der"
        --team "$IOS_TEAM_ID" --bundle "$BUNDLE_ID" --app-group "$APP_GROUP_IDENTIFIER"
    - name: Create iOS export options
      env:
        IOS_TEAM_ID: "${{ secrets.IOS_TEAM_ID }}"
        IOS_BUNDLE_ID: "${{ steps.ios_signing.outputs.bundle_id }}"
        IOS_EXTENSION_BUNDLE_ID: "${{ steps.ios_signing.outputs.extension_bundle_id
          }}"
      run: |
        set -euo pipefail

        if [ -z "${IOS_TEAM_ID}" ]; then
          echo "::error::Missing GitHub secret: IOS_TEAM_ID"
          exit 1
        fi

        cat > ios/ExportOptions.plist <<EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>method</key>
          <string>app-store-connect</string>
          <key>destination</key>
          <string>export</string>
          <key>teamID</key>
          <string>${IOS_TEAM_ID}</string>
          <key>signingStyle</key>
          <string>manual</string>
          <key>signingCertificate</key>
          <string>Apple Distribution</string>
          <key>provisioningProfiles</key>
          <dict>
            <key>${IOS_BUNDLE_ID}</key>
            <string>${IOS_PROFILE_NAME}</string>
            <key>${IOS_EXTENSION_BUNDLE_ID}</key>
            <string>${IOS_EXTENSION_PROFILE_NAME}</string>
          </dict>
          <key>manageAppVersionAndBuildNumber</key>
          <false/>
          <key>stripSwiftSymbols</key>
          <true/>
          <key>uploadSymbols</key>
          <true/>
        </dict>
        </plist>
        EOF
    - name: Configure iOS project signing
      env:
        FLAVOR: "${{ fromJSON(inputs.record).flavor }}"
        IOS_TEAM_ID: "${{ secrets.IOS_TEAM_ID }}"
      run: |
        set -euo pipefail

        ruby -e 'require "xcodeproj"'
        ruby <<'RUBY'
        require 'xcodeproj'

        flavor = ENV.fetch('FLAVOR')
        team_id = ENV.fetch('IOS_TEAM_ID')
        profile_names = {
          'Runner' => ENV.fetch('IOS_PROFILE_NAME'),
          'CredentialProvider' => ENV.fetch('IOS_EXTENSION_PROFILE_NAME')
        }

        project = Xcodeproj::Project.open('ios/Runner.xcodeproj')
        profile_names.each do |target_name, profile_name|
          target = project.targets.find { |candidate| candidate.name == target_name }
          abort("Missing Xcode target: #{target_name}") unless target

          target.build_configurations.each do |configuration|
            next unless configuration.name.end_with?("-#{flavor}")

            configuration.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
            configuration.build_settings['CODE_SIGN_STYLE'] = 'Manual'
            configuration.build_settings['DEVELOPMENT_TEAM'] = team_id
            configuration.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = profile_name
          end
        end

        project.save
        RUBY
    - name: Install dependencies
      run: flutter pub get
    - name: Select runtime configuration
      id: runtime_config
      env:
        FLAVOR: "${{ fromJSON(inputs.record).flavor }}"
        BACKEND_ENVIRONMENT: "${{ fromJSON(inputs.record).flavor }}"
        STAGING_API_BASE_URL: "${{ vars.STAGING_API_BASE_URL }}"
        PRODUCTION_API_BASE_URL: "${{ vars.PRODUCTION_API_BASE_URL }}"
      run: |
        set -euo pipefail

        backend_environment="${BACKEND_ENVIRONMENT}"
        if [ "${backend_environment}" = "matching" ]; then
          backend_environment="${FLAVOR}"
        fi
        if [ "${FLAVOR}" = "staging" ] && [ "${backend_environment}" != "staging" ]; then
          echo "::error::The staging distribution can only target the staging backend"
          exit 1
        fi

        if [ "$backend_environment" = production ]; then
          api_base_url="$PRODUCTION_API_BASE_URL"
        else
          api_base_url="$STAGING_API_BASE_URL"
        fi
        if [ -z "$api_base_url" ]; then
          echo "::error::Missing API base URL for the selected backend environment"
          exit 1
        fi
        {
          echo "api_base_url=$api_base_url"
          echo "backend_environment=${backend_environment}"
          echo "target=lib/main_${FLAVOR}.dart"
        } >> "$GITHUB_OUTPUT"
    - name: Prepare Google OAuth build configuration
      env:
        FLAVOR: "${{ fromJSON(inputs.record).flavor }}"
        BACKEND_ENVIRONMENT: "${{ steps.runtime_config.outputs.backend_environment
          }}"
        STAGING_GOOGLE_SERVER_CLIENT_ID: "${{ vars.STAGING_GOOGLE_SERVER_CLIENT_ID
          }}"
        PRODUCTION_GOOGLE_SERVER_CLIENT_ID: "${{ vars.PRODUCTION_GOOGLE_SERVER_CLIENT_ID
          }}"
        GOOGLE_IOS_CLIENT_ID: "${{ vars.GOOGLE_IOS_CLIENT_ID }}"
      run: |
        set -euo pipefail
        if [ "$BACKEND_ENVIRONMENT" = production ]; then
          export GOOGLE_SERVER_CLIENT_ID="$PRODUCTION_GOOGLE_SERVER_CLIENT_ID"
        else
          export GOOGLE_SERVER_CLIENT_ID="$STAGING_GOOGLE_SERVER_CLIENT_ID"
        fi
        python3 tool/configure_google_oauth.py --flavor "$FLAVOR" --platform ios
    - name: Prepare Firebase client configuration
      env:
        FLAVOR: "${{ fromJSON(inputs.record).flavor }}"
        FIREBASE_CLIENT_CONFIG: "${{ vars.FIREBASE_IOS_CONFIG }}"
      run: python3 tool/configure_firebase.py --flavor "$FLAVOR" --platform ios
    - name: Build iOS IPA
      env:
        FLAVOR: "${{ fromJSON(inputs.record).flavor }}"
        BACKEND_ENVIRONMENT: "${{ steps.runtime_config.outputs.backend_environment
          }}"
        TARGET: "${{ steps.runtime_config.outputs.target }}"
        API_BASE_URL: "${{ steps.runtime_config.outputs.api_base_url }}"
        BUILD_NAME: "${{ steps.app_version.outputs.build_name }}"
        BUILD_NUMBER: "${{ steps.app_version.outputs.build_number }}"
      run: |
        set -euo pipefail
        flutter build ipa \
          --release \
          --flavor "${FLAVOR}" \
          -t "${TARGET}" \
          --dart-define="PALLADIN_BACKEND_ENVIRONMENT=${BACKEND_ENVIRONMENT}" \
          --dart-define="PALLADIN_API_BASE_URL=${API_BASE_URL}" \
          --dart-define-from-file="config/google-oauth-${FLAVOR}.local.json" \
          --build-name "${BUILD_NAME}" \
          --build-number "${BUILD_NUMBER}" \
          --export-options-plist=ios/ExportOptions.plist
    - name: Stage the signed iOS artifact
      run: |
        set -euo pipefail
        release="$RUNNER_TEMP/ios-release"
        sbom_input="$RUNNER_TEMP/ios-sbom-input"
        mkdir -p "$release" "$sbom_input/ios"
        artifacts=(build/ios/ipa/*.ipa)
        test "${#artifacts[@]}" -eq 1
        cp "${artifacts[0]}" "$release/"
        cp pubspec.lock "$sbom_input/"
        cp ios/Podfile.lock "$sbom_input/ios/"
    - name: Remove Apple signing assets
      if: "${{ always() }}"
      run: |
        security delete-keychain "${RUNNER_TEMP}/app-signing.keychain-db" 2>/dev/null || true
        rm -f \
          "${RUNNER_TEMP}/ios_distribution.p12" \
          "${RUNNER_TEMP}/profile.mobileprovision" \
          "${RUNNER_TEMP}/credential-provider.mobileprovision" \
          "${RUNNER_TEMP}/profile.plist" \
          "${RUNNER_TEMP}/credential-provider.plist" \
          ios/ExportOptions.plist
        if [ -n "${IOS_PROFILE_UUID:-}" ]; then
          rm -f "${HOME}/Library/MobileDevice/Provisioning Profiles/${IOS_PROFILE_UUID}.mobileprovision"
        fi
        if [ -n "${IOS_EXTENSION_PROFILE_UUID:-}" ]; then
          rm -f "${HOME}/Library/MobileDevice/Provisioning Profiles/${IOS_EXTENSION_PROFILE_UUID}.mobileprovision"
        fi

        rm -f "$RUNNER_TEMP/distribution.pem" "$RUNNER_TEMP/distribution.der"
    - name: Generate the iOS artifact SBOM
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
      with:
        path: "${{ runner.temp }}/ios-sbom-input"
        format: spdx-json
        output-file: "${{ runner.temp }}/ios-release/sbom-ios.spdx.json"
        upload-artifact: false
        upload-release-assets: false
        dependency-snapshot: false
    - name: Bind artifact to reserved source and tests
      env:
        RELEASE_RECORD: "${{ inputs.record }}"
      run: python3 tool/mobile_release.py manifest --platform ios --directory "$RUNNER_TEMP/ios-release"
    - name: Attest the iOS IPA
      uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
      with:
        subject-path: "${{ runner.temp }}/ios-release/*.ipa"
    - name: Attest the iOS SBOM
      uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e
      with:
        subject-path: "${{ runner.temp }}/ios-release/*.ipa"
        sbom-path: "${{ runner.temp }}/ios-release/sbom-ios.spdx.json"
    - name: Attest release manifest
      uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
      with:
        subject-path: "${{ runner.temp }}/ios-release/release-manifest.json"
    - name: Upload iOS release set
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: mobile-${{ fromJSON(inputs.record).run_id }}-ios
        path: "${{ runner.temp }}/ios-release/*"
        if-no-files-found: error
        retention-days: 30
