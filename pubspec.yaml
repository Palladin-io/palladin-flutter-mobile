name: mobile_palladin
description: "Palladin — Zero-knowledge password manager for AI agents."
publish_to: 'none'
homepage: https://palladin.io
repository: https://github.com/Palladin-io/palladin-flutter-mobile
issue_tracker: https://github.com/Palladin-io/palladin-flutter-mobile/issues

version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.20.3

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1

  # Dependency injection
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Routing
  go_router: ^15.1.2
  url_launcher: ^6.3.2

  # Networking
  dio: ^5.8.0+1

  # Secure storage
  flutter_secure_storage: ^9.2.4

  # Lightweight key-value store for non-sensitive UI flags
  # (e.g. onboarding-checklist dismissal). Never used for secrets.
  shared_preferences: ^2.3.3

  # Biometric authentication (Face ID / fingerprint)
  local_auth: ^2.3.0

  # Crypto — libsodium FFI (Argon2id, X25519, crypto_secretbox)
  sodium_libs: ^3.4.1+2

  # BIP-39 mnemonic for recovery key
  bip39: ^1.0.6

  # Clipboard / share / file export for recovery key
  share_plus: ^10.1.2
  path_provider: ^2.1.4
  path: ^1.9.1
  sqflite: ^2.4.2

  # Import wizard — pick the source export file, parse CSV/JSON/
  # XML/ZIP from other password managers. `archive` + `xml` are already
  # pulled in transitively; declared explicitly here because we use them
  # directly.
  file_picker: ^8.1.2
  csv: ^6.0.0
  archive: ^3.6.1
  xml: ^6.5.0

  # Image picker for custom vault icon upload
  image_picker: ^1.1.2
  image: ^4.3.0

  # Typography — Inter font (matches web prototype)
  google_fonts: ^8.2.0

  # Google Sign-In
  google_sign_in: ^6.3.0

  # Firebase — push notifications (FCM / APNs)
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5

  # Foreground notification banner (Android heads-up; iOS shows natively)
  flutter_local_notifications: ^18.0.1

  # SHA-256 for TLS SPKI certificate pinning
  crypto: ^3.0.6

  # Canonical NFC validation for Vault protocol 2 AAD and RFC 8785 JSON.
  unorm_dart: ^0.3.2

  # Logging
  logger: ^2.5.0

  # Analytics
  posthog_flutter: ^5.0.0
  package_info_plus: ^8.0.0
  device_info_plus: ^11.2.0
  signalr_netcore: ^1.4.4

  # Opens system app-settings page (used to direct users to Notification
  # settings when the OS permission has been denied and cannot be re-prompted).
  app_settings: ^7.0.0

  # Enclave-bound, biometric-gated master-key storage for biometric unlock
  # iOS SecAccessControl .biometryCurrentSet / Android Keystore
  # setUserAuthenticationRequired — the MK is never stored where it can be
  # read without a fresh biometric authentication.
  biometric_storage: ^5.0.1
  mobile_scanner: ^7.2.0

  # Custom-scheme deep links — palladin://verify-email?token=…
  # routes an email-verification tap into the app on cold start + resume.
  app_links: ^6.3.2

  # Renders the TOTP enrollment QR (otpauth:// URI) so the user can scan
  # it into their authenticator app. Display-only; never scans.
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation
  injectable_generator: ^2.7.0
  build_runner: ^2.4.15

  # Testing
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  fake_async: ^1.3.1
  sodium: ^3.4.6
  sqflite_common_ffi: ^2.3.6

  # App icons
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  image_path: "assets/images/icon_light.png"
  android: true
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#FDF9E4"
  adaptive_icon_background: "#FDF9E4"
  adaptive_icon_foreground: "assets/images/icon_adaptive_fg.png"
  min_sdk_android: 21
  web:
    generate: false

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
