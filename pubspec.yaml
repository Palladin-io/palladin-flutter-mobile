name: mobile_claw_vault
description: "Claw Vault — Zero-knowledge password manager for AI agents."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1

  # Dependency injection
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Routing
  go_router: ^15.1.2

  # Networking
  dio: ^5.8.0+1

  # Secure storage
  flutter_secure_storage: ^9.2.4

  # Biometric authentication (Face ID / fingerprint)
  local_auth: ^2.3.0

  # Crypto — libsodium FFI (Argon2id, X25519, crypto_secretbox)
  sodium_libs: ^3.4.1+2

  # BIP-39 mnemonic for recovery key
  bip39: ^1.0.6

  # Clipboard / share / file export for recovery key
  share_plus: ^10.1.2
  path_provider: ^2.1.4

  # Image picker for custom vault icon upload
  image_picker: ^1.1.2

  # Typography — Inter font (matches web prototype)
  google_fonts: ^6.2.1

  # Google Sign-In
  google_sign_in: ^6.3.0

  # Firebase — push notifications (FCM / APNs)
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5

  # Foreground notification banner (Android heads-up; iOS shows natively)
  flutter_local_notifications: ^18.0.1

  # Logging
  logger: ^2.5.0

  # Analytics
  posthog_flutter: ^5.0.0
  package_info_plus: ^8.0.0
  signalr_netcore: ^1.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation
  injectable_generator: ^2.7.0
  build_runner: ^2.4.15

  # Testing
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

  # App icons
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  image_path: "assets/images/icon_light.png"
  android: true
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#FDF9E4"
  adaptive_icon_background: "#FDF9E4"
  adaptive_icon_foreground: "assets/images/icon_adaptive_fg.png"
  min_sdk_android: 21
  web:
    generate: false

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
