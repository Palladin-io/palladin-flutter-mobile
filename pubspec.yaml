name: mobile_claw_vault
description: "Claw Vault — Zero-knowledge password manager for AI agents."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1

  # Dependency injection
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Routing
  go_router: ^15.1.2

  # Networking
  dio: ^5.8.0+1

  # Secure storage
  flutter_secure_storage: ^9.2.4

  # Google Sign-In
  google_sign_in: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation
  injectable_generator: ^2.7.0
  build_runner: ^2.4.15

  # Testing
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
